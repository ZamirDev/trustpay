<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>TrustPay Guard</title>
    <link rel="stylesheet" href="guard.css" />
  </head>
  <body class="popup">
    <header class="popup-head">
      <svg class="popup-mascot" viewBox="0 0 100 100">
        <rect x="14" y="26" width="72" height="48" fill="#000000" stroke="#FFFFFF" stroke-width="5" />
        <rect x="22" y="34" width="56" height="32" fill="none" stroke="#8D8D8D" stroke-width="3" />
        <rect x="25" y="44" width="50" height="7" fill="#FFFFFF" />
        <rect x="57" y="55" width="13" height="8" fill="#03955B" stroke="#FFFFFF" stroke-width="3" />
      </svg>
      <div>
        <h1>TrustPay Guard</h1>
        <p>explainable checkout fraud risk</p>
      </div>
    </header>

    <section class="scan">
      <button id="scanBtn" class="clay-btn clay-btn-primary">🔍 Is this page safe?</button>
      <div id="scanResult" class="scan-result"></div>
    </section>

    <section class="guard">
      <button id="attachBtn" class="clay-btn">🛡 Attach guard</button>
      <p class="hint">Blocks a suspicious submit with a code check on this checkout — or a warning on a fake sign-in.</p>
    </section>

    <section id="verdict" class="verdict">
      <div class="empty">No live risk check yet — submit a checkout.</div>
    </section>

    <script src="popup.js"></script>
  </body>
</html>
