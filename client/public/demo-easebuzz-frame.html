<!doctype html>
<html lang="en">
  <!-- SIMULATED gateway checkout — the iframe content a real EaseCheckout
       popup would load from pay.easebuzz.in. Loaded by demo-popup.html.
       Form action points at the real host pattern https://pay.easebuzz.in/pay/
       (browser never submits — demo only), which is what makes the outer scan
       report "posts to a known payment processor" instead of scoring a
       cross-origin factor. Expected: payment page, 0 → allow. -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Checkout</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0; padding: 16px; background: #fff; color: #2b2b33;
        font-family: 'Segoe UI', system-ui, sans-serif; font-size: 14px;
      }
      .gw-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
      .gw-brand { font-weight: 800; font-size: 16px; color: #f26f21; letter-spacing: -0.2px; }
      .gw-amt { font-weight: 800; font-size: 15px; }
      .tabs { display: flex; gap: 6px; margin-bottom: 12px; }
      .tab { flex: 1; text-align: center; padding: 7px 4px; border: 2px solid #e5e0d6; border-radius: 8px;
        font-size: 12px; font-weight: 700; color: #8a8a93; }
      .tab.on { border-color: #f26f21; color: #f26f21; background: #fff4ec; }
      .field { margin-bottom: 10px; }
      .field label { display: block; font-size: 11.5px; font-weight: 700; margin-bottom: 4px; color: #4a4a52; }
      .field input {
        width: 100%; border: 2px solid #d9d4ca; border-radius: 8px; padding: 9px 10px; font: inherit;
      }
      .field input:focus { outline: none; border-color: #f26f21; }
      .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      button.pay {
        width: 100%; margin-top: 6px; border: 0; border-radius: 999px; padding: 11px;
        font: inherit; font-weight: 800; cursor: pointer; background: #f26f21; color: #fff;
      }
      .fine { font-size: 10.5px; color: #8a8a93; text-align: center; margin-top: 9px; line-height: 1.45; }
      .fine a { color: #2e7d32; font-weight: 700; }
    </style>
  </head>
  <body>
    <div class="gw-head">
      <div class="gw-brand">Easebuzz Checkout</div>
      <div class="gw-amt">₹499</div>
    </div>

    <div class="tabs">
      <div class="tab on">💳 Card</div>
      <div class="tab">UPI</div>
      <div class="tab">Netbanking</div>
    </div>

    <form action="https://pay.easebuzz.in/pay/" method="POST" id="gwForm" novalidate>
      <div class="field">
        <label for="gwcc">Card number</label>
        <input id="gwcc" name="card_number" autocomplete="cc-number" inputmode="numeric" maxlength="19" placeholder="1234 5678 9012 3456" />
      </div>
      <div class="row">
        <div class="field">
          <label for="gwex">Expiry</label>
          <input id="gwex" name="expiry" autocomplete="cc-exp" placeholder="MM / YY" />
        </div>
        <div class="field">
          <label for="gwcvc">CVC</label>
          <input id="gwcvc" name="cvv" autocomplete="cc-csc" inputmode="numeric" maxlength="4" placeholder="123" />
        </div>
      </div>
      <button type="submit" class="pay">Pay ₹499 securely</button>
    </form>

    <p class="fine">
      SIMULATED gateway page — demo only, nothing is transmitted.<br />
      Secured by the payment gateway · <a href="#">Refund policy</a> · <a href="#">Terms</a>
    </p>

    <script>
      document.getElementById('gwForm').addEventListener('submit', (e) => {
        if (e.defaultPrevented) return; // TrustPay Guard stopped it
        e.preventDefault();
        const f = e.target;
        f.innerHTML = '<p style="text-align:center;padding:34px 8px;font-weight:800">✅ Payment simulated.<br><span style="font-weight:600;color:#8a8a93;font-size:12px">No card data left this page.</span></p>';
      });
    </script>
  </body>
</html>
